name: Check

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: go run ./tools/build
      - run: node tools/editor-e2e/run.mjs --smoke
      - run: go test ./...
      - run: go vet ./...
      - run: node --test pkg/editor/web/model.test.mjs
      - run: go run ./cmd/super-mario fmt-levels -check
      - if: runner.os == 'Windows'
        run: python tools/editor-e2e/i18n_check.py .
      - if: runner.os == 'Windows'
        run: node tools/editor-e2e/run.mjs

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城堡对比</title>
<style>
:root {
  --bg: #f6f5f3; --surface: #ffffff; --fg: #1c1d20; --muted: #65676d;
  --border: #dedbd6; --accent: #c0392b;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --surface: #1b1e24; --fg: #e8e6e3; --muted: #9a9ca3;
    --border: #2a2e36; --accent: #e05a4a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font);
  padding: 28px 16px 64px;
}
.wrap { max-width: 1320px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 17px; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 78ch; }
.layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr) 600px; } }
.preview {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 12px;
}
@media (min-width: 1080px) { .preview { position: sticky; top: 16px; } }
.preview h2 { margin: 0; }
canvas { display: block; image-rendering: pixelated; border-radius: 3px; }
canvas.fluid { width: 100%; height: auto; }
.cap { color: var(--muted); font-size: 12.5px; }
.summary {
  font-family: var(--mono); font-size: 12.5px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px;
  overflow-wrap: anywhere; user-select: all; white-space: pre-wrap; max-height: 22em; overflow: auto;
}
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
button {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 4px;
  border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.chk { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
section.cat { margin-bottom: 30px; }
section.cat .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; max-width: 74ch; }
.opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.opt {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px; cursor: pointer; min-width: 0;
}
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt canvas { width: 100%; height: auto; }
.opt .nm { font-size: 13.5px; font-weight: 600; }
.opt .nm i { font-style: normal; color: var(--accent); margin-right: 6px; font-family: var(--mono); }
.opt .ds { font-size: 12px; color: var(--muted); line-height: 1.45; }
.note { color: var(--muted); font-size: 13px; max-width: 78ch; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>城堡对比</h1>
  <p class="lede">
    城堡重新画大了：宽 10 格、中间塔高 7 格半，三个塔楼，中间三层、两边两层，塔顶都有城垛。
    下面六个共用同一个轮廓，只换材质、窗户和屋顶。大图里左边是旗杆，右边是城堡，门口站着小人。
  </p>

  <div class="layout">
    <div id="cats"></div>

    <aside class="preview" aria-label="合成预览">
      <h2>合成预览</h2>
      <canvas id="big" class="fluid" width="1" height="1"></canvas>
      <span class="cap">大图接近终端里的真实大小。小人走到的位置就是城堡门。</span>
      <div class="tools">
        <label class="chk"><input type="checkbox" id="grid"> 格子线</label>
        <label class="chk"><input type="checkbox" id="dark"> 深色背景</label>
      </div>
      <div class="summary" id="summary"></div>
      <div class="tools">
        <button id="copy">复制我的选择</button>
        <button id="reset">全部恢复为现状</button>
        <span class="cap" id="copied" role="status"></span>
      </div>
      <p class="note">
        现在游戏里没有城堡，小人走到位置会直接消失。选定后我把城堡画进游戏，并让门的位置和他消失的位置对齐。
        三层、两层的分隔线用的是比墙深一档的颜色，远看能看出楼层。屋顶和窗户都可以再调。
      </p>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COL = {
    K: "#2a1a10",   /* outline / shadow */
    B: "#b8693f", b: "#8e4a2a",   /* brick, darker brick */
    S: "#a8aebd", s: "#7f8695",   /* stone, darker stone */
    R: "#c0392b", r: "#8f2a22",   /* roof */
    D: "#1a120c",   /* door */
    W: "#f0c860",   /* lit window */
    N: "#f5c842", n: "#c9951f",   /* ball */
    P: "#b7bcc9",                 /* pole */
    rG: "#58a64b", RG: "#3f7f3a", g: "#7f4d22",   /* grass, dark grass, soil */
    X: "#1a1a1a", w: "#f2f4f8"    /* flag cloth */
  };
  var SKY = "#12141a";

  var TS = 4, FLOOR = 40;         /* scene: 96 x 48 art px */
  var CW = 40, CH = 30;           /* castle: 40 x 30 art px, 10 x 7.5 tiles */
  var POLE_TILE = 8;              /* flagpole column, in tiles */
  var DOOR_TILE = 17;             /* castle door column, six tiles past the pole */

  /* Every castle is built from the user's sketch: three towers with red conical
     roofs, the middle one taller, stone walls with battlements, a dark window in
     each tower, and one arched door. The sketch's rows did not line up, so it is
     redrawn on a fixed 40 x 30 grid. No stone bridge at the bottom. */
  function makeCastle(opt) {
    var g = [];
    for (var y = 0; y < CH; y++) g.push(new Array(CW).fill('.'));

    function put(x, y, c) { if (x >= 0 && x < CW && y >= 0 && y < CH && c) g[y][x] = c; }
    function fill(x0, y0, x1, y1, c) {
      for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) put(x, y, c);
    }

    var WALL = opt.wall, SHADE = opt.shade, ROOF = opt.roof || 'R';

    /* A roof: a triangle, widest at its base, with a dark edge all round. */
    function roof(cx, halfW, topRow, baseRow) {
      var h = baseRow - topRow;
      for (var y = topRow; y <= baseRow; y++) {
        var half = Math.round(halfW * (y - topRow) / h);
        fill(cx - half, y, cx + half, y, ROOF);
      }
      for (var y = topRow; y <= baseRow; y++) {
        var half2 = Math.round(halfW * (y - topRow) / h);
        put(cx - half2, y, 'K');
        put(cx + half2, y, 'K');
      }
      fill(cx - halfW, baseRow, cx + halfW, baseRow, 'K');
      /* a small finial on the peak */
      put(cx, topRow - 1, 'K');
    }

    /* A tower: battlements on top, then wall, with the storeys marked by a
       shadow line. */
    function tower(x0, x1, top, bottom, storeys) {
      for (var x = x0; x <= x1; x++) put(x, top, ((x - x0) % 4) < 2 ? 'K' : WALL);
      fill(x0, top + 1, x1, bottom, WALL);
      for (var y = top; y <= bottom; y++) { put(x0, y, 'K'); put(x1, y, 'K'); }
      var h = bottom - top - 1;
      for (var i = 1; i < storeys; i++) {
        var y = top + 1 + Math.round(h * i / storeys);
        for (var x = x0 + 1; x < x1; x++) if (g[y][x] === WALL) g[y][x] = SHADE;
      }
    }

    function window4(x, y) {
      fill(x, y, x + 1, y + 3, opt.glass);
    }

    /* Wings, then the middle tower, then the roofs, so the middle wins at the
       joins. */
    tower(0, 9, 15, CH - 1, 2);
    tower(30, 39, 15, CH - 1, 2);
    tower(13, 26, 8, CH - 1, 3);

    /* The wall that joins the three towers at the second storey. */
    fill(1, 15, 38, CH - 1, WALL);
    for (var x = 1; x < 39; x++) { put(x, 15, ((x - 1) % 4) < 2 ? 'K' : WALL); }

    roof(4, 4, 9, 14);
    roof(35, 4, 9, 14);
    roof(19, 7, 0, 7);

    /* Windows: two in the middle tower, one in each wing. */
    window4(16, 10);
    window4(22, 10);
    window4(4, 19);
    window4(34, 19);

    /* Door: an arch in the middle of the middle tower, reaching the ground. */
    var dx0 = 17, dx1 = 22, dy0 = CH - 10;
    fill(dx0 - 1, dy0 - 1, dx1 + 1, CH - 1, 'K');
    fill(dx0, dy0, dx1, CH - 1, 'D');

    for (var x = 0; x < CW; x++) if (g[CH - 1][x] !== 'D') put(x, CH - 1, 'K');

    return g.map(function (r) { return r.join(''); });
  }

  var STYLES = [
    { name: "经典砖堡", ds: "砖墙、暗窗，最接近印象里的城堡。", wall: 'B', shade: 'b', glass: 'D', peak: false },
    { name: "灰石城堡", ds: "换成灰石，窗口亮着，和土色的地面分得最开。", wall: 'S', shade: 's', glass: 'W', peak: false },
    { name: "红顶砖堡", ds: "砖墙加红色尖顶，中间多一层屋顶，最显眼。", wall: 'B', shade: 'b', glass: 'W', peak: true, roofColour: 'R' },
    { name: "灰石尖塔", ds: "灰石加尖顶，窗户亮着，冷色调。", wall: 'S', shade: 's', glass: 'W', peak: true, roofColour: 'R' },
    { name: "暗砖金窗", ds: "砖墙压暗一档，金色窗户，夜里最像亮着灯。", wall: 'b', shade: 'K', glass: 'W', peak: false },
    { name: "线稿城堡", ds: "只留轮廓和楼层线，不填墙色，和夜空最协调。", wall: '.', shade: 'K', glass: 'W', peak: false }
  ];

  var CASTLES = STYLES.map(makeCastle);

  function dim(rows) {
    // A tower with wall '.' leaves the sky showing, so the outline reads.
    return rows;
  }

  var state = { sel: 0, hover: null, grid: false, dark: false };

  var off = document.createElement("canvas");
  off.width = 96; off.height = 48;
  var offCtx = off.getContext("2d");
  var buf = new Uint8ClampedArray(96 * 48 * 4);

  function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function px(x, y, h) {
    if (x < 0 || y < 0 || x >= 96 || y >= 48) return;
    var c = rgb(h), i = (y * 96 + x) * 4;
    buf[i] = c[0]; buf[i + 1] = c[1]; buf[i + 2] = c[2]; buf[i + 3] = 255;
  }
  function paint(rows, x, y) {
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        var col = COL[rows[r].charAt(c)];
        if (col) px(x + c, y + r, col);
      }
    }
  }

  function ground() {
    for (var x = 0; x < 96; x += 4) {
      px(x, FLOOR, COL.rG); px(x + 1, FLOOR, COL.rG); px(x + 2, FLOOR, COL.RG); px(x + 3, FLOOR, COL.rG);
      for (var y = FLOOR + 1; y < 48; y += 4) {
        for (var k = 0; k < 4; k++) {
          px(x + k, y, COL.g); px(x + k, y + 1, COL.g); px(x + k, y + 2, COL.g); px(x + k, y + 3, COL.g);
        }
      }
    }
  }

  var HERO = { R: "#d94a3d", S: "#f0b088", B: "#3a5fc8", O: "#6b7280", Q: "#f2f4f8" };
  var HERO_ROWS = ["..RR..", "..SS..", ".RRRRS", ".SBBB.", "......", "..QO..", "..OO.."];

  function render(sel) {
    var x, y;
    var sky = state.dark ? SKY : "#1b2030";
    for (y = 0; y < 48; y++) for (x = 0; x < 96; x++) px(x, y, sky);
    ground();

    /* flagpole */
    var poleX = POLE_TILE * TS;
    paint(["..N.."], poleX, 4);
    paint([".NNn."], poleX, 8);
    for (var py = 12; py < FLOOR; py += TS) paint([".P..", ".P..", ".P..", ".P.."], poleX, py);
    paint(["XwXw", "wXwX", "XwXw"], poleX - 16, 20);

    /* castle: its door sits on DOOR_TILE, so its left edge is half a castle
       back from that */
    var castle = CASTLES[sel];
    var castleX = DOOR_TILE * TS + 2 - CW / 2;
    paint(castle, Math.round(castleX), FLOOR - CH);

    /* the hero, at the door */
    paint(HERO_ROWS, DOOR_TILE * TS + 2 - 3, FLOOR - HERO_ROWS.length);
  }

  function drawTo(cv, sel, grid) {
    render(sel);
    offCtx.putImageData(new ImageData(buf, 96, 48), 0, 0);
    var ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, cv.width, cv.height);
    if (grid) {
      var z = cv.width / 96;
      ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1; ctx.beginPath();
      for (var gx = 0; gx <= 96; gx += TS) { ctx.moveTo(gx * z + 0.5, 0); ctx.lineTo(gx * z + 0.5, cv.height); }
      for (var gy = 0; gy <= 48; gy += TS) { ctx.moveTo(0, gy * z + 0.5); ctx.lineTo(cv.width, gy * z + 0.5); }
      ctx.stroke();
    }
  }

  var cards = [];
  function build() {
    var host = document.getElementById("cats");
    var sec = document.createElement("section"); sec.className = "cat";
    var h = document.createElement("h2"); h.textContent = "城堡"; sec.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub";
    sub.textContent = "六个都是同一个轮廓：宽 10 格、中间三层、两边两层，塔顶有城垛。选的是材质和细节。";
    sec.appendChild(sub);
    var grid = document.createElement("div"); grid.className = "opts"; sec.appendChild(grid);

    STYLES.forEach(function (c, i) {
      var label = document.createElement("label"); label.className = "opt" + (i === 0 ? " on" : "");
      var input = document.createElement("input");
      input.type = "radio"; input.name = "castle"; input.value = String(i);
      if (i === 0) input.checked = true;
      var cv = document.createElement("canvas"); cv.width = 96 * 4; cv.height = 48 * 4;
      var nm = document.createElement("span"); nm.className = "nm";
      var letter = document.createElement("i"); letter.textContent = String.fromCharCode(65 + i);
      nm.appendChild(letter); nm.appendChild(document.createTextNode(c.name));
      var ds = document.createElement("span"); ds.className = "ds"; ds.textContent = c.ds;
      label.appendChild(input); label.appendChild(cv); label.appendChild(nm); label.appendChild(ds);
      grid.appendChild(label);

      input.addEventListener("change", function () {
        state.sel = i;
        Array.prototype.forEach.call(grid.children, function (el, k) { el.classList.toggle("on", k === i); });
        refresh();
      });
      function over() { state.hover = i; refreshBig(); }
      function out() { state.hover = null; refreshBig(); }
      label.addEventListener("mouseenter", over);
      label.addEventListener("mouseleave", out);
      input.addEventListener("focus", over);
      input.addEventListener("blur", out);
      cards.push(cv);
    });
    host.appendChild(sec);
  }

  var big;
  function refreshBig() {
    var i = state.hover === null ? state.sel : state.hover;
    drawTo(big, i, state.grid);
  }
  function refresh() {
    refreshBig();
    cards.forEach(function (cv, i) { drawTo(cv, i, false); });
    document.getElementById("summary").textContent =
      "城堡 " + String.fromCharCode(65 + state.sel) + "「" + STYLES[state.sel].name + "」\n" +
      "castle=" + String.fromCharCode(65 + state.sel);
  }

  function init() {
    big = document.getElementById("big");
    big.width = 96 * 8; big.height = 48 * 8;
    build();
    refresh();
    document.getElementById("grid").addEventListener("change", function (e) { state.grid = e.target.checked; refreshBig(); });
    document.getElementById("dark").addEventListener("change", function (e) { state.dark = e.target.checked; refresh(); });
    document.getElementById("reset").addEventListener("click", function () {
      state.sel = 0;
      Array.prototype.forEach.call(document.querySelectorAll(".opts"), function (grid) {
        Array.prototype.forEach.call(grid.children, function (el, k) {
          el.classList.toggle("on", k === 0);
          el.querySelector("input").checked = (k === 0);
        });
      });
      refresh();
    });
    var copied = document.getElementById("copied");
    document.getElementById("copy").addEventListener("click", function () {
      var text = "城堡 " + String.fromCharCode(65 + state.sel) + "「" + STYLES[state.sel].name + "」\n" +
        "castle=" + String.fromCharCode(65 + state.sel);
      var done = function (msg) { copied.textContent = msg; setTimeout(function () { copied.textContent = ""; }, 2400); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done("已复制"); }, function () { done("复制失败，请手动选中上面的文字"); });
      } else { done("请手动选中上面的文字复制"); }
    });
  }

  window.__CASTLE__ = { CASTLES: CASTLES, STYLES: STYLES, COL: COL };
  init();
})();
</script>
</body>
</html>

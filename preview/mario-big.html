<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大个子小人</title>
<style>
:root {
  --bg: #f6f5f3; --surface: #ffffff; --fg: #1c1d20; --muted: #65676d;
  --border: #dedbd6; --accent: #c0392b; --good: #2f7d4f; --warn: #9a6a12;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --surface: #1b1e24; --fg: #e8e6e3; --muted: #9a9ca3;
    --border: #2a2e36; --accent: #e05a4a; --good: #6fbf86; --warn: #e0b060;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font);
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 74ch; }
.bar {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 22px;
}
.bar .group { display: flex; gap: 6px; align-items: center; }
.bar .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
.bar label.chk { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
button {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 4px;
  border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer;
}
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.card header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tag { font-size: 12px; border-radius: 3px; padding: 0 6px; white-space: nowrap; border: 1px solid; color: var(--good); }
.tag.old { color: var(--muted); }
canvas { display: block; image-rendering: pixelated; background: #12141a; border-radius: 3px; }
canvas.fluid { width: 100%; height: auto; }
.row { display: flex; gap: 12px; align-items: center; }
.cap { color: var(--muted); font-size: 12px; }
ul { margin: 0; padding: 0; list-style: none; font-size: 13.5px; display: grid; gap: 3px; }
li.pro::before { content: "＋ "; color: var(--good); font-weight: 600; }
li.con::before { content: "－ "; color: var(--warn); font-weight: 600; }
section { margin-top: 28px; }
.frames { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 10px; }
.frameset { display: flex; flex-direction: column; gap: 8px; }
.frameset h3 { font-size: 13.5px; margin: 0; color: var(--muted); font-weight: 500; }
.poses { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.frame { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.frame canvas { border: 1px solid var(--border); }
.frame span { font-size: 12px; color: var(--muted); }
.note { color: var(--muted); font-size: 13.5px; max-width: 80ch; margin: 12px 0 0; }
.note b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>大个子小人</h1>
  <p class="lede">
    吃到蘑菇长大之后：宽一个像素（6 → 7 格），头 3×3，轮子 3×3。帽子一行、脸两行，
    脖子是中间一个肤色格，红色一行、蓝色两行。跳跃时每只手再多一格，补在拐弯处和身体连起来。
  </p>

  <div class="bar">
    <div class="group" role="group" aria-label="朝向">
      <span class="label">朝向</span>
      <button data-dir="right" aria-pressed="true">朝右（顺时针）</button>
      <button data-dir="left" aria-pressed="false">朝左（逆时针）</button>
    </div>
    <div class="group" role="group" aria-label="演示">
      <span class="label">演示</span>
      <button data-mode="loop" aria-pressed="true">走路 → 跳跃 → 落地</button>
      <button data-mode="walk" aria-pressed="false">只看滚动</button>
      <button data-mode="stand" aria-pressed="false">只看站立</button>
    </div>
    <label class="chk"><input type="checkbox" id="grid" checked> 像素网格</label>
    <label class="chk"><input type="checkbox" id="pause"> 暂停</label>
  </div>

  <div class="grid" id="cards"></div>

  <section>
    <h2>逐帧放大</h2>
    <div class="frames" id="frames"></div>
    <p class="note">
      大个子的轮子是 3×3：<b>外圈 8 格，中间 1 格是空的</b>，透出背后的东西。白点沿外圈顺时针走一圈要 8 帧，
      比小个子的 2×2（4 帧）更细腻，转速也相应调慢，保证同样的位移转同样的角度。
    </p>
  </section>
</div>

<script>
(function () {
  "use strict";

  var COL = {
    R: "#d94a3d", B: "#3a5fc8", s: "#f0b088",
    W: "#6b7280",   /* wheel */
    M: "#f2f4f8",   /* the white marker */
    /* The centre cell of the 3x3 wheel is deliberately absent from this table:
       it is transparent, so whatever is behind the wheel shows through. Painting
       it a fixed sky colour would leave a dark square if the wheel ever passed
       in front of a brick or a pipe. */
  };
  var SKY = "#12141a", GROUND = "#a8692f", EDGE = "#c98a4b",
      BRICK = "#a8643c", OUT = "#4a3220";

  /* Everything is drawn facing right; facing left is the mirror image. */

  /* Small (6 wide). Head 2x2-ish: hat row, face row. Body, one empty row,
     then a 2x2 wheel. */
  var SMALL_BODY = {
    still: ["..RR..", "..ss..", ".RRRRs", ".sBBB.", "......"],
    jump:  ["..RR..", "..ss.s", ".RRRR.", "sBBBB.", "......"]
  };
  /* The 2x2 wheel: columns 2-3. */
  var SMALL_MARK = [[0, 2], [0, 3], [1, 3], [1, 2]];
  function smallSprite(pose, phase) {
    var wheel = ["..WW..", "..WW.."].map(function (r) { return r.split(""); });
    var m = SMALL_MARK[((phase % 4) + 4) % 4];
    wheel[m[0]][m[1]] = "M";
    return SMALL_BODY[pose].concat(wheel.map(function (r) { return r.join(""); }));
  }

  /* Big (7 wide). One hat row, two face rows, a single skin-coloured neck
     cell in the middle, one red row, two blue rows, an empty row so the body
     floats, then the 3x3 wheel.

     Hands: while walking the front hand (right) sits at the shoulder and the
     back hand (left) is tucked in at the waist. On the jump the front hand
     lifts and the back hand drops out to the waist. On the jump each hand gets
     one extra cell, so an arm is two cells joined at a bend: the walking cell
     stays where it was and the new one sits a row above (front) or a row above
     (back), touching the body. */
  var HEAD = [".RRR.", ".sss.", ".sss."];

  function bigRows(headRows, pose) {
    var head = headRows.map(function (r) { return "." + r + "."; });   /* 7 wide */
    var rest;
    if (pose === "jump") {
      rest = [
        "...s..s",     /* neck; front hand, upper cell */
        "sRRRRRs",     /* red row; front hand keeps its walking cell on the right, back hand gains one on the left */
        "sBBBBB.",     /* blue row 1; back hand keeps its walking cell, now on the left */
        ".BBBBB.",     /* blue row 2 */
        "......."      /* empty row: floating */
      ];
    } else {
      rest = [
        "...s...",     /* neck */
        ".RRRRRs",     /* red row; front hand at the shoulder */
        ".sBBBB.",     /* blue row 1; back hand tucked in at the waist */
        ".BBBBB.",     /* blue row 2 */
        "......."
      ];
    }
    return head.concat(rest);
  }

  /* The 3x3 wheel: columns 2-4. The marker walks the eight outer cells
     clockwise starting at the top-left; the centre never changes. */
  var BIG_RING = [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2], [2, 1], [2, 0], [1, 0]];
  function bigSprite(headRows, pose, phase) {
    /* "T" marks the transparent hub; drawSprite skips any symbol with no colour. */
    var wheel = ["..WWW..", "..WTW..", "..WWW.."].map(function (r) { return r.split(""); });
    var m = BIG_RING[((phase % 8) + 8) % 8];
    wheel[m[0]][m[1] + 2] = "M";
    return bigRows(headRows, pose).concat(wheel.map(function (r) { return r.join(""); }));
  }

  var CARDS = [
    { title: "小个子", tag: "6 宽 · 对照用", cls: "old", kind: "small",
      pro: ["现在定下来的版本"], con: [] },
    { title: "大个子", tag: "7 宽 · 帽1 脸2 红1 蓝2", cls: "", kind: "big",
      pro: ["脖子是一个肤色格，头和身体分得开", "蓝色两行占身体大半，一眼是马里奥"],
      con: ["红色只剩一行，上衣显得很薄"] }
  ];

  function spriteFor(kind, pose, phase) {
    if (kind === "small") return smallSprite(pose, phase);
    return bigSprite(HEAD, pose, phase);
  }
  function ringLen(kind) { return kind === "small" ? 4 : 8; }
  function quarterTravel(kind) { return kind === "small" ? 1.5 : 1.5; }

  var W = 34, H = 18;
  var state = { t: 0, grid: true, paused: false, dir: "right", mode: "loop" };

  /* One full wheel turn covers the wheel's circumference. A 2-wide wheel
     travels about 6 pixels per turn; a 3-wide one about 9. Phase advances by
     ring length per circumference, so distance per phase step is
     circumference / ring length. */
  function dist(kind) { return kind === "small" ? 6 / 4 : 9 / 8; }

  var ARC = [0, -1, -2, -3, -3, -3, -2, -1];
  function frameAt(t, kind) {
    var step = 1 / dist(kind);                 /* phase steps per pixel moved */
    if (state.mode === "stand") return { pose: "still", x: 14, dy: 0, ph: 0 };
    if (state.mode === "walk")  return { pose: "still", x: 3 + (t % 26), dy: 0, ph: Math.floor((t % 26) * step) };
    var seq = [], ph = 0, i, j, k2;
    for (i = 0; i < 12; i++) { seq.push({ pose: "still", x: 3 + i, dy: 0, ph: Math.floor(ph) }); ph += step; }
    for (j = 0; j < ARC.length; j++) seq.push({ pose: "jump", x: 15 + j, dy: ARC[j], ph: Math.floor(ph) });
    for (k2 = 0; k2 < 4; k2++) { seq.push({ pose: "still", x: 23 + k2, dy: 0, ph: Math.floor(ph) }); ph += step; }
    seq.push({ pose: "still", x: 27, dy: 0, ph: Math.floor(ph) }, { pose: "still", x: 27, dy: 0, ph: Math.floor(ph) });
    return seq[t % seq.length];
  }

  function mirror(rows) { return rows.map(function (r) { return r.split("").reverse().join(""); }); }
  function px(ctx, z, x, y, c) { ctx.fillStyle = c; ctx.fillRect(x * z, y * z, z, z); }
  function drawSprite(ctx, z, rows, x0, y0) {
    for (var r = 0; r < rows.length; r++)
      for (var c = 0; c < rows[r].length; c++) {
        var ch = rows[r].charAt(c);
        if (COL[ch]) px(ctx, z, x0 + c, y0 + r, COL[ch]);
      }
  }
  function gridLines(ctx, z, w, h) {
    ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var gx = 0; gx <= w; gx++) { ctx.moveTo(gx * z + 0.5, 0); ctx.lineTo(gx * z + 0.5, h * z); }
    for (var gy = 0; gy <= h; gy++) { ctx.moveTo(0, gy * z + 0.5); ctx.lineTo(w * z, gy * z + 0.5); }
    ctx.stroke();
  }

  var GROUND_ROW = 14;

  function drawScene(ctx, z, kind) {
    ctx.fillStyle = SKY; ctx.fillRect(0, 0, W * z, H * z);
    for (var x = 0; x < W; x++) {
      px(ctx, z, x, GROUND_ROW, EDGE);
      for (var y = GROUND_ROW + 1; y < H; y++) px(ctx, z, x, y, GROUND);
    }
    /* A strip of brick directly behind the wheel's hub, so a transparent
       centre shows brick here and sky everywhere else. */
    for (var tx = 0; tx < W; tx++) if (tx % 9 < 3) px(ctx, z, tx, GROUND_ROW - 2, BRICK);
    /* A four-pixel block for scale. */
    for (var by = 10; by < 14; by++) for (var bx = 15; bx < 19; bx++) px(ctx, z, bx, by, BRICK);
    for (var i = 15; i < 19; i++) { px(ctx, z, i, 10, OUT); px(ctx, z, i, 12, OUT); }
    px(ctx, z, 15, 11, OUT); px(ctx, z, 17, 13, OUT);

    var f = frameAt(state.t, kind);
    var rows = spriteFor(kind, f.pose, f.ph), boxLeft = f.x;
    if (state.dir === "left") { rows = mirror(rows); boxLeft = (W - 4) - f.x; }
    var left = boxLeft - (rows[0].length - 4) / 2;
    drawSprite(ctx, z, rows, left, GROUND_ROW - rows.length + f.dy);
    if (state.grid && z >= 10) gridLines(ctx, z, W, H);
  }

  var BIG = 18, REAL = 8, live = [];

  function buildCards() {
    var host = document.getElementById("cards");
    CARDS.forEach(function (c) {
      var card = document.createElement("article"); card.className = "card";
      var head = document.createElement("header");
      var h = document.createElement("h2"); h.textContent = c.title;
      var tag = document.createElement("span"); tag.className = "tag " + c.cls; tag.textContent = c.tag;
      head.appendChild(h); head.appendChild(tag); card.appendChild(head);

      var big = document.createElement("canvas");
      big.className = "fluid"; big.width = W * BIG; big.height = H * BIG; card.appendChild(big);

      var row = document.createElement("div"); row.className = "row";
      var real = document.createElement("canvas");
      real.width = W * REAL; real.height = H * REAL;
      real.style.width = (W * REAL) + "px"; real.style.height = (H * REAL) + "px";
      var cap = document.createElement("span"); cap.className = "cap"; cap.textContent = "← 接近终端里的真实大小";
      row.appendChild(real); row.appendChild(cap); card.appendChild(row);

      var ul = document.createElement("ul");
      c.pro.forEach(function (t) { var li = document.createElement("li"); li.className = "pro"; li.textContent = t; ul.appendChild(li); });
      c.con.forEach(function (t) { var li = document.createElement("li"); li.className = "con"; li.textContent = t; ul.appendChild(li); });
      card.appendChild(ul);

      host.appendChild(card);
      live.push({ kind: c.kind, big: big.getContext("2d"), real: real.getContext("2d") });
    });
  }

  function buildFrames() {
    var host = document.getElementById("frames");

    /* Posed frames: small vs the two big heads, standing and jumping. */
    var set = document.createElement("div"); set.className = "frameset";
    var h3 = document.createElement("h3"); h3.textContent = "姿势对比（朝右）"; set.appendChild(h3);
    var poses = document.createElement("div"); poses.className = "poses";
    [["small", "still", "小 · 站立"], ["small", "jump", "小 · 跳跃"],
     ["big", "still", "大 · 站立"], ["big", "jump", "大 · 跳跃"]].forEach(function (p) {
      var rows = spriteFor(p[0], p[1], 0), z = 14;
      var wrap = document.createElement("div"); wrap.className = "frame";
      var cv = document.createElement("canvas");
      cv.width = rows[0].length * z; cv.height = rows.length * z;
      var ctx = cv.getContext("2d");
      ctx.fillStyle = SKY; ctx.fillRect(0, 0, cv.width, cv.height);
      drawSprite(ctx, z, rows, 0, 0);
      gridLines(ctx, z, rows[0].length, rows.length);
      var lab = document.createElement("span"); lab.textContent = p[2];
      wrap.appendChild(cv); wrap.appendChild(lab); poses.appendChild(wrap);
    });
    set.appendChild(poses); host.appendChild(set);

    /* The eight wheel frames of the big one. */
    var ws = document.createElement("div"); ws.className = "frameset";
    var h4 = document.createElement("h3"); h4.textContent = "大个子轮子的 8 帧（只画轮子，朝右，顺时针）"; ws.appendChild(h4);
    var wp = document.createElement("div"); wp.className = "poses";
    for (var p = 0; p < 8; p++) {
      var whole = bigSprite(HEAD, "still", p);
      var rows2 = whole.slice(whole.length - 3).map(function (r) { return r.slice(2, 5); });
      var z2 = 22, wrap2 = document.createElement("div"); wrap2.className = "frame";
      var cv2 = document.createElement("canvas");
      cv2.width = 3 * z2; cv2.height = 3 * z2;
      var c2 = cv2.getContext("2d");
      c2.fillStyle = SKY; c2.fillRect(0, 0, cv2.width, cv2.height);
      drawSprite(c2, z2, rows2, 0, 0);
      gridLines(c2, z2, 3, 3);
      var lab2 = document.createElement("span"); lab2.textContent = "第 " + (p + 1) + " 帧";
      wrap2.appendChild(cv2); wrap2.appendChild(lab2); wp.appendChild(wrap2);
    }
    ws.appendChild(wp); host.appendChild(ws);
  }

  function paint() {
    live.forEach(function (c) {
      c.big.imageSmoothingEnabled = false; c.real.imageSmoothingEnabled = false;
      drawScene(c.big, BIG, c.kind); drawScene(c.real, REAL, c.kind);
    });
  }

  buildCards(); buildFrames(); paint();

  function bindGroup(attr, key) {
    var btns = document.querySelectorAll("button[" + attr + "]");
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener("click", function () {
        state[key] = b.getAttribute(attr); state.t = 0;
        Array.prototype.forEach.call(btns, function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
        paint();
      });
    });
  }
  bindGroup("data-dir", "dir");
  bindGroup("data-mode", "mode");

  document.getElementById("grid").addEventListener("change", function (e) { state.grid = e.target.checked; paint(); });
  var pauseBox = document.getElementById("pause");
  pauseBox.addEventListener("change", function (e) { state.paused = e.target.checked; });
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    pauseBox.checked = true; state.paused = true;
  }
  setInterval(function () { if (!state.paused) { state.t++; paint(); } }, 150);
})();
</script>
</body>
</html>

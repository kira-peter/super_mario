<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小人手臂方案</title>
<style>
:root {
  --bg: #f6f5f3; --surface: #ffffff; --fg: #1c1d20; --muted: #65676d;
  --border: #dedbd6; --accent: #c0392b; --good: #2f7d4f; --warn: #9a6a12;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --surface: #1b1e24; --fg: #e8e6e3; --muted: #9a9ca3;
    --border: #2a2e36; --accent: #e05a4a; --good: #6fbf86; --warn: #e0b060;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font);
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
.bar {
  display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 22px;
}
.bar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pair { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 26px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.card header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tag { font-size: 12px; border-radius: 3px; padding: 0 6px; white-space: nowrap; border: 1px solid; }
.tag.bad { color: var(--warn); }
.tag.ok { color: var(--good); }
canvas { display: block; image-rendering: pixelated; background: #12141a; border-radius: 3px; }
canvas.fluid { width: 100%; height: auto; }
.row { display: flex; gap: 12px; align-items: center; }
.cap { color: var(--muted); font-size: 12px; }
.frames { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); margin: 4px 0 0; }
.frame { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.frame canvas { background: #12141a; border: 1px solid var(--border); }
.frame span { font-size: 12.5px; color: var(--muted); text-align: center; }
.note { color: var(--muted); font-size: 13.5px; max-width: 76ch; margin: 8px 0 0; }
.note b { color: var(--fg); font-weight: 600; }
section { margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>小人手臂方案</h1>
  <p class="lede">
    行走和站立时，手放在肩膀两侧；跳跃时，手整体往上移一格。左边是之前有问题的画法，右边是按你说的重画的。
  </p>

  <div class="bar">
    <label><input type="checkbox" id="grid" checked> 显示像素网格</label>
    <label><input type="checkbox" id="pause"> 暂停动画</label>
    <span class="cap">动画依次演示：走路 → 起跳 → 落地</span>
  </div>

  <div class="pair" id="pair"></div>

  <section>
    <h2>逐帧放大（你的方案）</h2>
    <div class="frames" id="frames"></div>
    <p class="note">
      每个小格是一个终端像素。注意<b>跳跃帧的第二行</b>：手上移到脸的高度之后，和脸的肤色连成了整整一排四格，
      所以抬手时脸看起来会变宽。这是手和脸同色、又只有 4 格宽造成的，不是画错了。
    </p>
  </section>
</div>

<script>
(function () {
  "use strict";

  var PAL = { R: "#d94a3d", B: "#3a5fc8", s: "#f0b088", h: "#8a5a30" };
  var SKY = "#12141a", GROUND = "#a8692f", EDGE = "#c98a4b",
      BRICK = "#a8643c", QBLOCK = "#e0b060", OUT = "#4a3220";

  /* 4 wide, 5 tall. Rows: hat, face, shoulders, trousers, feet. */
  var BEFORE = {
    idle:  [".RR.", ".ss.", "RRRR", "BBBB", "h..h"],
    walkA: [".RR.", ".ss.", "RRRR", "BBBB", "hh.h"],
    walkB: [".RR.", ".ss.", "RRRR", "BBBB", "h.hh"],
    jump:  ["sRRs", ".ss.", "RRRR", "BBBB", "h..h"]          /* hands beside the hat */
  };
  var AFTER = {
    idle:  [".RR.", ".ss.", "sRRs", "BBBB", "h..h"],          /* hands at the shoulders */
    walkA: [".RR.", ".ss.", "sRRs", "BBBB", "hh.h"],
    walkB: [".RR.", ".ss.", "sRRs", "BBBB", "h.hh"],
    jump:  [".RR.", "ssss", "RRRR", "BBBB", "h..h"]          /* hands one row higher */
  };

  var CARDS = [
    { title: "之前", tag: "手在帽子两侧", cls: "bad", spr: BEFORE },
    { title: "你的方案", tag: "肩侧 → 上移一格", cls: "ok", spr: AFTER }
  ];

  var W = 30, H = 12;
  var state = { t: 0, grid: true, paused: false };

  /* One loop: walk, take off, hang, land. */
  var TIMELINE = [];
  for (var i = 0; i < 12; i++) TIMELINE.push({ pose: i % 2 ? "walkB" : "walkA", x: 2 + i, dy: 0 });
  var ARC = [0, -1, -2, -3, -3, -3, -2, -1];
  for (var j = 0; j < ARC.length; j++) TIMELINE.push({ pose: "jump", x: 14 + j, dy: ARC[j] });
  for (var k = 0; k < 4; k++) TIMELINE.push({ pose: k % 2 ? "walkB" : "walkA", x: 22 + k, dy: 0 });
  TIMELINE.push({ pose: "idle", x: 26, dy: 0 }, { pose: "idle", x: 26, dy: 0 });

  function px(ctx, z, x, y, color) { ctx.fillStyle = color; ctx.fillRect(x * z, y * z, z, z); }

  function drawSprite(ctx, z, rows, x0, y0) {
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        var ch = rows[r].charAt(c);
        if (PAL[ch]) px(ctx, z, x0 + c, y0 + r, PAL[ch]);
      }
    }
  }

  function gridLines(ctx, z, w, h) {
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= w; gx++) { ctx.moveTo(gx * z + 0.5, 0); ctx.lineTo(gx * z + 0.5, h * z); }
    for (var gy = 0; gy <= h; gy++) { ctx.moveTo(0, gy * z + 0.5); ctx.lineTo(w * z, gy * z + 0.5); }
    ctx.stroke();
  }

  function drawScene(ctx, z, spr) {
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W * z, H * z);
    for (var x = 0; x < W; x++) {
      px(ctx, z, x, 8, EDGE);
      for (var y = 9; y < 12; y++) px(ctx, z, x, y, GROUND);
    }
    for (var by = 4; by < 8; by++) for (var bx = 16; bx < 20; bx++) px(ctx, z, bx, by, BRICK);
    for (var i = 16; i < 20; i++) { px(ctx, z, i, 4, OUT); px(ctx, z, i, 6, OUT); }
    px(ctx, z, 16, 5, OUT); px(ctx, z, 18, 7, OUT);

    var f = TIMELINE[state.t % TIMELINE.length];
    var rows = spr[f.pose];
    drawSprite(ctx, z, rows, f.x, 8 - rows.length + f.dy);
    if (state.grid && z >= 10) gridLines(ctx, z, W, H);
  }

  var BIG = 22, REAL = 8, live = [];

  function buildPair() {
    var host = document.getElementById("pair");
    CARDS.forEach(function (c) {
      var card = document.createElement("article");
      card.className = "card";
      var head = document.createElement("header");
      var h = document.createElement("h2"); h.textContent = c.title;
      var tag = document.createElement("span"); tag.className = "tag " + c.cls; tag.textContent = c.tag;
      head.appendChild(h); head.appendChild(tag); card.appendChild(head);

      var big = document.createElement("canvas");
      big.className = "fluid"; big.width = W * BIG; big.height = H * BIG;
      card.appendChild(big);

      var row = document.createElement("div"); row.className = "row";
      var real = document.createElement("canvas");
      real.width = W * REAL; real.height = H * REAL;
      real.style.width = (W * REAL) + "px"; real.style.height = (H * REAL) + "px";
      var cap = document.createElement("span"); cap.className = "cap"; cap.textContent = "← 接近终端里的真实大小";
      row.appendChild(real); row.appendChild(cap); card.appendChild(row);

      host.appendChild(card);
      live.push({ spr: c.spr, big: big.getContext("2d"), real: real.getContext("2d") });
    });
  }

  function buildFrames() {
    var host = document.getElementById("frames");
    [["idle", "站立"], ["walkA", "走路 A"], ["walkB", "走路 B"], ["jump", "跳跃"]].forEach(function (p) {
      var wrap = document.createElement("div"); wrap.className = "frame";
      var z = 26, cv = document.createElement("canvas");
      cv.width = 4 * z; cv.height = 5 * z;
      var ctx = cv.getContext("2d");
      drawSprite(ctx, z, AFTER[p[0]], 0, 0);
      gridLines(ctx, z, 4, 5);
      var lab = document.createElement("span"); lab.textContent = p[1];
      wrap.appendChild(cv); wrap.appendChild(lab); host.appendChild(wrap);
    });
  }

  function paint() {
    live.forEach(function (c) {
      c.big.imageSmoothingEnabled = false; c.real.imageSmoothingEnabled = false;
      drawScene(c.big, BIG, c.spr);
      drawScene(c.real, REAL, c.spr);
    });
  }

  buildPair(); buildFrames(); paint();

  document.getElementById("grid").addEventListener("change", function (e) { state.grid = e.target.checked; paint(); });
  var pauseBox = document.getElementById("pause");
  pauseBox.addEventListener("change", function (e) { state.paused = e.target.checked; });
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    pauseBox.checked = true; state.paused = true;
  }
  setInterval(function () { if (!state.paused) { state.t++; paint(); } }, 150);
})();
</script>
</body>
</html>
